<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="logo/logo.png" type="image/png" />
  <title>Nostalgia Collection · Ο λογαριασμός μου</title>
  <link rel="stylesheet" href="css/fonts.css?v=1" />
<link rel="stylesheet" href="css/base.css?v=locale-drawer" />
  <link rel="stylesheet" href="css/side-nav.css?v=mobile-header-3" />
  <link rel="stylesheet" href="css/shop.css?v=cart-drawer" />
  <link rel="stylesheet" href="css/account.css?v=light4" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("nostalgia-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      try {
        var l = localStorage.getItem("nostalgia-lang");
        if (l === "en" || l === "el") document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="account">
  <div class="page-wrap">
    <header class="site-header">
      <nav class="site-header__bar" data-i18n-aria="nav_aria">
        <div class="mobile-nav-panel" id="mobile-nav-panel">
          <div class="site-nav site-nav--left">
            <a href="index.html" data-i18n="nav_home">Αρχική</a>
            <a href="collection.html" data-i18n="nav_collection">Συλλογή</a>
          </div>
          <a class="site-header__logo site-header__logo--pulse" href="index.html" data-i18n-aria="logo_aria">
            <img class="brand-logo brand-logo--dark" src="logo/logo.png" width="200" height="58" alt="Nostalgia Collection" />
            <img class="brand-logo brand-logo--light" src="logo/logo%20light.png?v=2" width="200" height="58" alt="Nostalgia Collection" />
          </a>
          <div class="site-nav site-nav--right">
            <a href="about.html" data-i18n="nav_about">Σχετικά</a>
            <a href="contact.html" data-i18n="nav_contact">Επικοινωνία</a>
            <button type="button" class="lang-toggle" id="lang-toggle" aria-live="polite">English</button>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-live="polite"></button>
          </div>
        </div>
        <a class="site-header__logo site-header__logo--topbar" href="index.html" data-i18n-aria="logo_aria">
          <img class="brand-logo brand-logo--dark" src="logo/logo.png" width="200" height="58" alt="Nostalgia Collection" />
          <img class="brand-logo brand-logo--light" src="logo/logo%20light.png?v=2" width="200" height="58" alt="Nostalgia Collection" />
        </a>
        <button class="mobile-nav-toggle" type="button" aria-controls="mobile-nav-panel" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button>
      </nav>
    </header>
    <main class="account-page">
      <div class="account-page__split">
        <section class="account-page__panel">
          <div id="account-panel-root"></div>
        </section>
        <figure class="account-page__visual" aria-hidden="true">
          <img src="Contact%20page%20photo/contact%20photo.png" alt="" />
        </figure>
      </div>
    </main>
    <footer class="site-footer"></footer>
  </div>
  <script defer src="js/europe-countries.js"></script>
  <script defer src="js/images.js?v=2"></script>
    <script defer src="js/i18n-bundles/shared.js?v=1"></script>
  <script defer src="js/i18n-bundles/content.js?v=1"></script>
  <script defer src="js/i18n-bundles/shop.js?v=1"></script>
  <script defer src="js/i18n-core.js?v=1"></script>
  <script defer src="js/cookies.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/side-nav.js?v=7"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/account.js?v=8"></script>
  <script defer src="js/breadcrumbs.js?v=4"></script>

  <script defer src="js/theme.js"></script>
  <script defer src="js/header-scroll.js"></script>
</body>
</html>
