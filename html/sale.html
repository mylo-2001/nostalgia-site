<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/logo/logo.png" type="image/png" />
  <title>Nostalgia Collection · Εκπτώσεις</title>

<body data-page="showcase" data-showcase="sale">
  <div class="page-wrap">
    <header class="site-header">
      <nav class="site-header__bar" data-i18n-aria="nav_aria">
        <div class="mobile-nav-panel" id="mobile-nav-panel">
          <div class="site-nav site-nav--left">
            <a href="/" data-i18n="nav_home">Αρχική</a>
            <a href="/collection" data-i18n="nav_collection">Συλλογή</a>
          </div>
          <a class="site-header__logo site-header__logo--pulse" href="/" data-i18n-aria="logo_aria">
            <img class="brand-logo brand-logo--dark" src="images/logo/logo.png" width="200" height="58" alt="Nostalgia Collection" />
            <img class="brand-logo brand-logo--light" src="images/logo/logo%20light.png?v=2" width="200" height="58" alt="Nostalgia Collection" />
          </a>
          <div class="site-nav site-nav--right">
            <a href="/about" data-i18n="nav_about">Σχετικά</a>
            <a href="/contact" data-i18n="nav_contact">Επικοινωνία</a>
            <button type="button" class="lang-toggle" id="lang-toggle">English</button>
            <button type="button" class="theme-toggle" id="theme-toggle"></button>
          </div>
        </div>
        <a class="site-header__logo site-header__logo--topbar" href="/" data-i18n-aria="logo_aria">
          <img class="brand-logo brand-logo--dark" src="images/logo/logo.png" width="200" height="58" alt="Nostalgia Collection" />
          <img class="brand-logo brand-logo--light" src="images/logo/logo%20light.png?v=2" width="200" height="58" alt="Nostalgia Collection" />
        </a>
        <button class="mobile-nav-toggle" type="button" aria-controls="mobile-nav-panel" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button>
      </nav>
    </header>
    <main>
      <section class="editorial-hero">
        <figure class="editorial-hero__figure">
          <div class="editorial-hero__zoom is-animating">
            <picture>
              <source type="image/webp" srcset="images/collections-hero/%CE%95%CE%BA%CF%80%CF%84%CF%8E%CF%83%CE%B5%CE%B9%CF%82-hero-photo-480w.webp 480w, images/collections-hero/%CE%95%CE%BA%CF%80%CF%84%CF%8E%CF%83%CE%B5%CE%B9%CF%82-hero-photo-960w.webp 960w, images/collections-hero/%CE%95%CE%BA%CF%80%CF%84%CF%8E%CF%83%CE%B5%CE%B9%CF%82-hero-photo-1440w.webp 1440w" sizes="100vw" />
              <img class="editorial-hero__img" src="images/collections-hero/%CE%95%CE%BA%CF%80%CF%84%CF%8E%CF%83%CE%B5%CE%B9%CF%82-hero-photo.png" alt="" width="1200" height="900" loading="eager" decoding="async" />
            </picture>
          </div>
          <div class="editorial-hero__overlay" aria-hidden="true"></div>
        </figure>
        <div class="editorial-hero__inner">
          <header class="editorial-hero__head">
            <h1 class="editorial-hero__title" data-i18n="sale_title">Εκπτώσεις</h1>
            <p class="editorial-hero__lead" data-i18n="sale_lead">Επιλεγμένα προϊόντα σε ειδική τιμή — για περιορισμένο χρονικό διάστημα.</p>
          </header>
        </div>
      </section>
      <section class="showcase" aria-labelledby="showcase-heading">
        <h2 id="showcase-heading" class="visually-hidden" data-i18n="sale_title">Εκπτώσεις</h2>
        <div class="showcase__bar">
          <p class="showcase__count" id="showcase-count" aria-live="polite"></p>
        </div>
        <div class="showcase-grid" id="showcase-grid" role="list"></div>
      </section>
    </main>
    <footer class="site-footer"></footer>
  </div>
  <script defer src="js/api.js?v=1"></script>
  <script defer src="js/europe-countries.js"></script>
  <script defer src="js/images.js?v=4"></script>
  <script defer src="js/i18n-bundles/shared.js?v=stock-notice1"></script>

  <script defer src="js/i18n-core.js?v=1"></script>
  <script defer src="js/cookies.js"></script>
  <script src="js/tracking.js?v=1" defer></script>
  <script src="js/welcome-offer.js?v=1" defer></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/breadcrumbs.js?v=4"></script>
  <script defer src="js/site-polish.js?v=6"></script>
  <script defer src="js/side-nav.js?v=cat10"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/showcase.js?v=clr3"></script>
  <script defer src="js/account.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/header-scroll.js"></script>
