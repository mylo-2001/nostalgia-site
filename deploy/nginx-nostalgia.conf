# nginx reverse proxy for Nostalgia (VPS). Replace nostalgia.example.com with your domain.
#
# Install:
#   sudo cp deploy/nginx-nostalgia.conf /etc/nginx/sites-available/nostalgia
#   sudo ln -s /etc/nginx/sites-available/nostalgia /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d nostalgia.example.com     # issues + wires TLS automatically
#   sudo nginx -t && sudo systemctl reload nginx
#
# Notes:
#  - The Node app trusts one proxy hop (app.set('trust proxy', 1) when NODE_ENV=production),
#    so X-Forwarded-For / X-Forwarded-Proto below give correct client IP + Secure cookies.
#  - The Stripe webhook (/api/v2/stripe/webhook) needs the RAW body. nginx forwards the body
#    unchanged by default — do NOT add any body-rewriting/sub_filter on that path.

server {
    listen 80;
    listen [::]:80;
    server_name nostalgia.example.com;
    # certbot places the ACME challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nostalgia.example.com;

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/nostalgia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nostalgia.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Admin product images upload up to ~10MB each; allow headroom.
    client_max_body_size 15m;

    # Security headers (the app also sets some; these are belt-and-suspenders).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
