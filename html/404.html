<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/logo/logo.png" type="image/png" />
  <title>Nostalgia Collection · 404</title>
  <link rel="stylesheet" href="css/fonts.css?v=1" />
  <link rel="stylesheet" href="css/base.css?v=locale-drawer" />
  <script src="js/theme-boot.js"></script>
  <style>
    .nf {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: clamp(2rem, 5vw, 4.5rem) 1.5rem;
      background: var(--surface-paper);
      color: var(--ink);
    }

    .nf::before,
    .nf::after {
      content: "";
      position: absolute;
      left: clamp(1rem, 4vw, 4rem);
      right: clamp(1rem, 4vw, 4rem);
      height: 1px;
      background: var(--rule-hairline);
      pointer-events: none;
    }

    .nf::before { top: clamp(1rem, 3vw, 2rem); }
    .nf::after { bottom: clamp(1rem, 3vw, 2rem); }

    .nf__content {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 680px);
      flex-direction: column;
      align-items: center;
    }

    .nf__brand {
      position: relative;
      display: block;
      width: min(78vw, 520px);
      height: clamp(72px, 9vw, 104px);
      margin-bottom: clamp(1.4rem, 3.5vh, 2.5rem);
      overflow: hidden;
      opacity: 0;
      animation: nfReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.08s forwards;
    }

    .nf__logo {
      position: absolute;
      top: 50%;
      left: 0;
      display: block;
      width: 100%;
      height: auto;
      transform: translateY(-50%);
    }

    .nf__logo--night { display: none; }
    [data-theme="dark"] .nf__logo--paper { display: none; }
    [data-theme="dark"] .nf__logo--night {
      display: block;
      filter: invert(1) brightness(1.08);
    }

    .nf__code-row {
      display: flex;
      width: min(100%, 590px);
      align-items: center;
      gap: clamp(1rem, 4vw, 2.2rem);
      opacity: 0;
      animation: nfCodeReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }

    .nf__code-row::before,
    .nf__code-row::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: var(--accent-muted);
    }

    .nf__code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 16vw, 10rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: 0;
      color: var(--accent);
      margin: 0;
    }

    .nf__copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translate3d(0, 12px, 0);
      animation: nfReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.42s forwards;
    }

    .nf__title {
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 3.4vw, 2rem);
      font-weight: 500;
      letter-spacing: 0;
      margin: clamp(1.8rem, 4vh, 2.8rem) 0 0;
    }

    .nf__text {
      max-width: 46ch;
      margin: 0.9rem 0 0;
      font-size: clamp(0.98rem, 1.5vw, 1.12rem);
      line-height: 1.7;
      color: var(--ink-muted);
    }

    [data-theme="dark"] .nf__text { color: rgba(240, 232, 218, 0.72); }

    .nf__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      min-height: 52px;
      margin-top: clamp(1.9rem, 4vh, 2.8rem);
      padding: 0.9rem 2rem;
      border: 1px solid rgba(36, 28, 20, 0.42);
      font-family: var(--font-nav, var(--font-display));
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      animation: nfReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.62s forwards;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .nf__btn-arrow {
      font-size: 1rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .nf__btn:hover,
    .nf__btn:focus-visible {
      background: var(--ink);
      color: var(--surface-paper);
      border-color: var(--ink);
      box-shadow: 0 10px 28px rgba(36, 28, 20, 0.12);
      outline: none;
    }

    .nf__btn:hover .nf__btn-arrow,
    .nf__btn:focus-visible .nf__btn-arrow {
      transform: translateX(-3px);
    }

    [data-theme="dark"] .nf__btn {
      color: rgba(240, 232, 218, 0.9);
      border-color: rgba(197, 160, 96, 0.42);
    }
    [data-theme="dark"] .nf__btn:hover,
    [data-theme="dark"] .nf__btn:focus-visible {
      background: var(--accent);
      color: #0a0908;
      border-color: var(--accent);
    }

    @keyframes nfReveal {
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes nfCodeReveal {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-height: 700px) {
      .nf {
        padding-top: 2.5rem;
        padding-bottom: 2.5rem;
      }

      .nf__brand {
        width: min(68vw, 430px);
        height: 70px;
        margin-bottom: 1.2rem;
      }

      .nf__code { font-size: clamp(5rem, 16vh, 7.5rem); }
      .nf__title { margin-top: 1.4rem; }
      .nf__btn { margin-top: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nf__brand,
      .nf__code-row,
      .nf__copy,
      .nf__btn {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body data-page="not-found">
  <main class="nf">
    <div class="nf__content">
      <a class="nf__brand" href="/" aria-label="Nostalgia Candle">
        <img
          class="nf__logo nf__logo--paper"
          src="images/home-photo-beforemenu/photo3-logo-transparent-480w.webp?v=1"
          srcset="images/home-photo-beforemenu/photo3-logo-transparent-480w.webp?v=1 480w, images/home-photo-beforemenu/photo3-logo-transparent-960w.webp?v=1 960w"
          sizes="min(78vw, 520px)"
          width="1566"
          height="522"
          alt="Nostalgia Candle"
        />
        <img
          class="nf__logo nf__logo--night"
          src="images/home-photo-beforemenu/photo1-logo-transparent-480w.webp?v=1"
          srcset="images/home-photo-beforemenu/photo1-logo-transparent-480w.webp?v=1 480w, images/home-photo-beforemenu/photo1-logo-transparent-960w.webp?v=1 960w"
          sizes="min(78vw, 520px)"
          width="1562"
          height="516"
          alt=""
        />
      </a>
      <div class="nf__code-row" aria-hidden="true">
        <p class="nf__code">404</p>
      </div>
      <div class="nf__copy">
        <h1 class="nf__title" id="nf-title">Η σελίδα δεν βρέθηκε</h1>
        <p class="nf__text" id="nf-text">
          Η σελίδα που ψάχνεις δεν υπάρχει ή έχει μετακινηθεί. Επίστρεψε στην αρχική για να συνεχίσεις την περιήγηση.
        </p>
      </div>
      <a class="nf__btn" href="/" id="nf-btn">
        <span class="nf__btn-arrow" aria-hidden="true">←</span>
        <span id="nf-btn-label">Επιστροφή στην αρχική</span>
      </a>
    </div>
  </main>

  <script>
    (function () {
      try {
        var lang = localStorage.getItem("nostalgia-lang");
        if (lang === "en") {
          document.documentElement.lang = "en";
          document.getElementById("nf-title").textContent = "Page not found";
          document.getElementById("nf-text").textContent =
            "The page you are looking for doesn't exist or has moved. Head back to the home page to keep browsing.";
          document.getElementById("nf-btn-label").textContent = "Back to home";
          document.title = "Nostalgia Collection · 404";
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
